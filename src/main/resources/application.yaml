server:
  port: 8080

spring:
  application:
    name: onebrain
  jackson:
    default-property-inclusion: non_null
    generator:
      write-bigdecimal-as-plain: true
  datasource:
    url: jdbc:h2:mem:onebrain;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  cloud:
    aws:
      # por padrão aponta para o LocalStack do docker compose; em outro ambiente, sobrescreva as variáveis
      endpoint: ${AWS_ENDPOINT:http://localhost:4566}
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        enabled: ${coupon.sqs.enabled}

coupon:
  sqs:
    # consumer da fila ligado por padrão; COUPON_SQS_ENABLED=false sobe só a API, sem precisar do LocalStack
    enabled: ${COUPON_SQS_ENABLED:true}
    queue: ${COUPON_SQS_QUEUE:coupon-status-queue}
  idempotencia:
    ttl-processando: 30s
    ttl-concluido: 24h

logging:
  pattern:
    # campos do MDC em cada linha de log (preenchidos pelo MdcFilter)
    correlation: "[correlationId=%X{correlationId:-} couponId=%X{couponId:-}] "

springdoc:
  swagger-ui:
    path: /swagger-ui.html
