server:
  port: 8080

spring:
  application:
    name: onebrain
  jackson:
    default-property-inclusion: non_null
    generator:
      write-bigdecimal-as-plain: true
  datasource:
    url: jdbc:h2:mem:onebrain;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
